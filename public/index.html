<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blackbox Recomps</title><meta name="description" content="Android ports of PC games with download links (static recompiled ports).">
<style>
:root{--bg:#050805;--c:#0b100b;--b:#1b2b1b;--t:#e8f5e8;--m:#7f997f;--a:#22e65a;--a2:#9dff6b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--t)}
.hero{display:flex;align-items:center;justify-content:center;gap:16px;padding:28px 16px 24px;border-bottom:1px solid var(--a);background:radial-gradient(circle at 20% 55%,rgba(34,230,90,.2),transparent 55%),repeating-linear-gradient(0deg,transparent 0 23px,rgba(34,230,90,.05) 23px 24px)}
.fig{flex:none;width:38%;max-width:170px}.fig svg,.fig img{width:100%;height:auto;display:block;filter:drop-shadow(0 0 10px rgba(34,230,90,.5))}
.ht{flex:1;min-width:0;max-width:420px}
.kick{font-size:.68rem;letter-spacing:.28em;color:var(--a);text-transform:uppercase}
.logo{font-size:clamp(1.6rem,8vw,2.6rem);font-weight:900;line-height:1.02;margin:6px 0 8px;text-transform:uppercase;letter-spacing:-.5px}
.logo span{display:block;color:var(--a);text-shadow:0 0 18px rgba(34,230,90,.65)}
.hero p{margin:0;color:var(--m);font-size:.88rem;line-height:1.4}
main{max-width:1100px;margin:auto;padding:16px 16px 50px}
#q{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--b);background:var(--c);color:var(--t);font:inherit}
#q:focus{outline:2px solid var(--a);border-color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--b);background:var(--c);color:var(--m);font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--a);border-color:var(--a);color:#031003;font-weight:700}
.count{color:var(--m);font-size:.8rem;margin:10px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);border-color:var(--a);box-shadow:0 0 18px rgba(34,230,90,.2)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#101a10}
.body{padding:14px;display:flex;flex-direction:column;gap:7px;flex:1}.body h3{margin:0;font-size:1.02rem}
.meta{display:flex;gap:8px;font-size:.75rem;color:var(--m)}.meta b{color:var(--a);font-weight:600}
.body p{margin:0;color:var(--m);font-size:.85rem;line-height:1.4;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btn{text-align:center;text-decoration:none;color:#031003;font-weight:700;padding:11px;border-radius:10px;background:var(--a)}
.btns{display:flex;flex-direction:column;gap:8px}.btn.alt{background:transparent;border:1px solid var(--a);color:var(--a)}.btn:active{opacity:.85}.empty{text-align:center;color:var(--m);padding:40px 0}
footer{text-align:center;color:var(--m);font-size:.78rem;padding:20px;border-top:1px solid var(--b)}
</style></head><body>
<div class="hero"><div class="fig" id="fig"><svg viewBox="0 0 130 165" role="img" aria-label="Silhouette"><g fill="#0b140b" stroke="#22e65a" stroke-width="1.6" stroke-linejoin="round"><circle cx="50" cy="28" r="16"/><path d="M14 165L18 84Q22 58 50 54Q78 58 82 84L86 165Z"/><path d="M68 72L108 64" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M100 54H126V62H108V76H99Z"/></g><path d="M50 54L40 84L50 100L60 84Z" fill="#22e65a"/></svg></div>
<div class="ht"><div class="kick">Android &bull; Recompiled</div><div class="logo">Blackbox<span>Recomps</span></div>
<p>Android ports of PC games with download links (static recompiled ports).</p></div></div>
<main><input id="q" type="search" placeholder="Search games&hellip;" autocomplete="off">
<div class="chips" id="chips"></div><div class="count" id="n"></div>
<div class="grid" id="g"></div><div class="empty" id="e" hidden>No games found.</div></main>
<footer>&copy; <span id="y"></span> Blackbox Recomps</footer>
<script>
const $=i=>document.getElementById(i);let G=[],cat='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function chips(){const cs=['All',...new Set(G.map(x=>x.category))];
$('chips').innerHTML=cs.map(c=>'<button class="chip'+((c==='All'&&!cat)||c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join('')}
const bt=(u,t,c)=>u?'<a class="btn'+c+'" href="'+esc(u)+'" target="_blank" rel="noopener nofollow">'+t+'</a>':'';
const btns=x=>'<div class="btns">'+bt(x.link,'⬇ Launcher','')+bt(x.link2,'⬇ Game Files',' alt')+'</div>';
function show(){const q=$('q').value.toLowerCase().trim();
const l=G.filter(x=>(!cat||x.category===cat)&&(x.title+' '+x.desc).toLowerCase().includes(q));
$('g').innerHTML=l.map(x=>'<div class="card"><img loading="lazy" src="'+esc(x.image)+'" alt="" onerror="this.style.visibility=\'hidden\'"><div class="body"><h3>'+esc(x.title)+'</h3><div class="meta"><b>'+esc(x.category)+'</b>'+(x.size?'<span>'+esc(x.size)+'</span>':'')+'</div><p>'+esc(x.desc)+'</p>'+btns(x)+'</div></div>').join('');
$('e').hidden=l.length>0;$('n').textContent=G.length?l.length+' game'+(l.length===1?'':'s'):''}
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c==='All'?'':b.dataset.c;chips();show()};
const im=new Image();im.alt='';im.onload=()=>{$('fig').innerHTML='';$('fig').appendChild(im)};im.src='/hero.png';
$('q').oninput=show;$('y').textContent=new Date().getFullYear();
fetch('/api/games').then(r=>r.json()).then(d=>{G=d;chips();show()}).catch(()=>{$('e').hidden=false;$('e').textContent='Could not load games.'});
</script></body></html>
